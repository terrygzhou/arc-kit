[project]
name = "arckit-mcp"
version = "0.1.0"
description = "ArcKit MCP server - exposes the ArcKit architecture-governance harness as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
]
authors = [{ name = "terrygzhou" }]
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "architecture",
    "enterprise",
    "governance",
    "mcp",
    "model-context-protocol",
]

[project.scripts]
arckit-mcp = "arckit_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arckit_mcp"]

[tool.setuptools.package-data]
arckit_mcp = ["*.py"]
